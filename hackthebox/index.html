<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grehaus — Hack The Box</title>
<meta name="description" content="Hack The Box write-ups — Labs, Sherlocks, Challenges">

<!--
  TEMPLATE NOTES:
  Each category tab (Labs / Sherlocks / Challenges) expands directly
  into a list of write-ups — no intermediate difficulty page.

  To add a new write-up:
    1. Create the folder, e.g. hack-the-box/labs/lab02/index.html
       (copy hack-the-box/labs/lab01/index.html as a starting point)
    2. Add an .entry-link row to the matching panel below, with the
       difficulty class (difficulty-easy/medium/hard/insane), the
       filled bar segments, and its tags.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#16181b; --bg-alt:#1b1e22; --bg-term:#111315; --bg-chip:#202428;
    --border:#2b3035; --border-hi:#3a4046;
    --text:#cfd4d8; --text-dim:#767d84; --text-faint:#4c5257; --bright:#f2f4f5;
    --sky:#6fc3e6; --sky-dim:rgba(111,195,230,0.14);
    --ochre:#d3a526; --orange:#e37a3c;
    --diff-easy:#56c27a; --diff-medium:#d3a526; --diff-hard:#d9483c; --diff-insane:#a874e8;
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --radius:6px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  a{ color:var(--sky); text-decoration:none; }
  a:hover{ text-decoration:underline; text-decoration-color:var(--sky); }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--sky); outline-offset:2px; }
  ::selection{ background:var(--sky-dim); color:var(--bright); }

  .crt::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none; border-radius:inherit;
  }

  .statusbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--bg-alt); border-bottom:1px solid var(--border); font-size:13px; gap:12px; flex-wrap:wrap; }
  .statusbar .brand{ color:var(--bright); font-weight:700; }
  .statusbar .brand::before{ content:"~/"; color:var(--text-faint); }
  .statusbar nav{ display:flex; gap:18px; }
  .statusbar nav a{ color:var(--text-dim); }
  .statusbar nav a:hover{ color:var(--sky); text-decoration:none; }
  .statusbar .sys{ color:var(--text-faint); display:flex; gap:14px; }
  .statusbar .dot-ochre{ color:var(--ochre); }

  main{ max-width:820px; margin:0 auto; padding:48px 20px 20px; }
  .lede{ margin:0 0 6px; font-size:13px; color:var(--text-faint); letter-spacing:.04em; }
  .lede .path{ color:var(--orange); }
  .lede.back{ margin-bottom:30px; }
  .lede.back a{ color:var(--text-dim); }
  .lede.back a:hover{ color:var(--sky); }

  section h2{ font-size:12px; text-transform:uppercase; letter-spacing:.18em; color:var(--text-faint); margin:0 0 12px; font-weight:600; }
  section h2 span{ color:var(--orange); }

  /* ---------- category tabs ---------- */
  .cat-bar{ display:flex; gap:10px; margin-bottom:0; flex-wrap:wrap; }
  .cat-btn{
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text-dim);
    background: var(--bg-term);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 11px 18px;
    cursor: pointer;
    display:flex; align-items:center; gap:8px;
  }
  .cat-btn::before{ content:"›"; color: var(--text-faint); transition: transform .15s ease; display:inline-block; }
  .cat-btn[aria-expanded="true"]{ color: var(--bright); background: var(--bg-term); border-color: var(--border-hi); }
  .cat-btn[aria-expanded="true"]::before{ content:"›"; color: var(--sky); transform: rotate(90deg); }
  .cat-btn:hover{ color: var(--text); }

  .cat-panels{
    border: 1px solid var(--border-hi);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    background: var(--bg-term);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
    margin-bottom: 56px;
    overflow: hidden;
  }
  .cat-panel{ display:none; padding: 6px 4px; }
  .cat-panel.active{ display:block; }

  /* ---------- write-up entry rows ---------- */
  .entry-link{
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .entry-link:last-child{ border-bottom:none; }
  a.entry-link:hover{ background: rgba(255,255,255,0.02); text-decoration:none; }
  a.entry-link:hover .entry-name{ text-decoration: underline; text-decoration-color: var(--sky); }

  .entry-name{ font-weight:700; color: var(--bright); font-size: 14.5px; min-width: 66px; }

  .entry-bar{ display:inline-flex; gap:2px; flex-shrink:0; }
  .entry-bar span{ width:9px; height:11px; background:var(--border); border-radius:1px; }
  .entry-bar span.filled{ background: currentColor; }
  .entry-link.difficulty-easy   .entry-bar{ color:var(--diff-easy); }
  .entry-link.difficulty-medium .entry-bar{ color:var(--diff-medium); }
  .entry-link.difficulty-hard   .entry-bar{ color:var(--diff-hard); }
  .entry-link.difficulty-insane .entry-bar{ color:var(--diff-insane); }

  .entry-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .entry-tags span{
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border-hi);
    color: var(--text-dim);
  }

  .entry-empty{
    padding: 22px 18px;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .entry-empty .ls-tag{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:1px solid var(--border-hi); color:var(--text-faint); margin-left:8px; }

  footer{ max-width:820px; margin:0 auto; padding:20px 20px 60px; color:var(--text-faint); font-size:12px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }

  @media (max-width:600px){
    .statusbar{ font-size:12px; }
    .statusbar .sys{ display:none; }
    .entry-link{ align-items:flex-start; }
    .entry-name{ min-width: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="statusbar">
  <span class="brand">grehaus/writeups/hack-the-box</span>
  <nav>
    <a href="/">home</a>
    <a href="../">writeups</a>
  </nav>
  <div class="sys">
    <span class="dot-ochre">● online</span>
    <span id="clock">00:00:00</span>
  </div>
</header>

<main>
  <p class="lede">guest@grehaus <span class="path">~/writeups/hack-the-box</span></p>
  <p class="lede back">$ cd .. <a href="../">→ back to writeups/</a></p>

  <section>
    <h2>categories <span>// select a type</span></h2>

    <div class="cat-bar" role="tablist" aria-label="Write-up categories">
      <button class="cat-btn" id="tab-labs" role="tab" aria-controls="panel-labs" aria-expanded="false">Labs</button>
      <button class="cat-btn" id="tab-sherlocks" role="tab" aria-controls="panel-sherlocks" aria-expanded="false">Sherlocks</button>
      <button class="cat-btn" id="tab-challenges" role="tab" aria-controls="panel-challenges" aria-expanded="false">Challenges</button>
    </div>

    <div class="cat-panels crt">
      <div class="cat-panel" id="panel-labs" role="tabpanel" aria-labelledby="tab-labs">
        <a class="entry-link difficulty-medium" href="./labs/lab01/">
          <span class="entry-name">Lab01</span>
          <span class="entry-bar" aria-hidden="true">
            <span class="filled"></span><span class="filled"></span><span class="filled"></span>
            <span class="filled"></span><span class="filled"></span>
            <span></span><span></span><span></span><span></span><span></span>
          </span>
          <span class="entry-tags">
            <span>SMB</span><span>Web Exploitation</span><span>Active Directory</span>
          </span>
        </a>
        <!-- EDIT: copy the row above for each new lab, e.g. Lab02 -->
      </div>

      <div class="cat-panel" id="panel-sherlocks" role="tabpanel" aria-labelledby="tab-sherlocks">
        <p class="entry-empty">No write-ups yet <span class="ls-tag">coming soon</span></p>
      </div>

      <div class="cat-panel" id="panel-challenges" role="tabpanel" aria-labelledby="tab-challenges">
        <p class="entry-empty">No write-ups yet <span class="ls-tag">coming soon</span></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <span class="prompt">exit</span>
  <span>© <span id="year"></span> grehaus — logged out</span>
</footer>

<script>
  const clockEl = document.getElementById('clock');
  function tick(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
  document.getElementById('year').textContent = new Date().getFullYear();

  // category tab accordion
  const tabs = document.querySelectorAll('.cat-btn');
  const panels = document.querySelectorAll('.cat-panel');

  function openTab(tab){
    tabs.forEach(t => t.setAttribute('aria-expanded', 'false'));
    panels.forEach(p => p.classList.remove('active'));
    tab.setAttribute('aria-expanded', 'true');
    document.getElementById(tab.getAttribute('aria-controls')).classList.add('active');
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const isOpen = tab.getAttribute('aria-expanded') === 'true';
      tabs.forEach(t => t.setAttribute('aria-expanded', 'false'));
      panels.forEach(p => p.classList.remove('active'));
      if (!isOpen) {
        tab.setAttribute('aria-expanded', 'true');
        document.getElementById(tab.getAttribute('aria-controls')).classList.add('active');
      }
    });
  });

  // open Labs by default
  openTab(document.getElementById('tab-labs'));
</script>
</body>
</html>
