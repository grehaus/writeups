<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hack Smarter: Samurai</title>
<meta name="description" content="hack-smarter: Samurai">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="statusbar">
  <span class="brand">grehaus/writeups/hack-smarter</span>
  <nav>
    <a href="/">home</a>
    <a href="../../../">writeups</a>
  </nav>
  <div class="sys">
    <span class="dot-ochre">● online</span>
    <span id="clock">00:00:00</span>
  </div>
</header>

<main>
  <p class="lede">guest@grehaus <span class="path">~/writeups/hack-smarter/Samurai</span></p>
  <p class="lede back">$ cd .. <a href="../../">→ back to hack-smarter/</a></p>

  <!-- filled in automatically from content.md -->
  <div id="infocard-mount"></div>

  <div class="win crt">
    <div class="win-bar">
      <div class="win-dots"><span></span><span></span><span></span></div>
      <div class="win-title">guest@grehaus: ~/writeups/hack-smarter/Samurai</div>
    </div>
    <!-- filled in automatically from content.md -->
    <div class="win-body" id="term-mount">
      <p class="row out dim">Loading write-up…</p>
    </div>
  </div>
</main>

<footer>
  <span class="prompt">exit</span>
  <span>© <span id="year"></span> grehaus — logged out</span>
</footer>

<script>
  const clockEl = document.getElementById('clock');
  function tick(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="/assets/markdown-writeup.js"></script>
<script src="/assets/interactive.js"></script>
</body>
</html>
